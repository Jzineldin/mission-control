name: npm supply-chain gate

on:
  workflow_dispatch: {}
  pull_request:
  push:

permissions:
  contents: read

jobs:
  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - name: Check live npm incident IOCs
        run: node scripts/check-npm-supply-chain.mjs
      - name: Verify npm registry signatures
        run: |
          npm audit signatures
          (cd frontend && npm audit signatures)
      - name: Verify frozen npm lockfiles
        run: |
          npm ci --ignore-scripts
          (cd frontend && npm ci --ignore-scripts)
